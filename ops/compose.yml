name: folio
services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: folio-postgres
    environment:
      POSTGRES_PASSWORD: ${FOLIO_POSTGRES_PASSWORD:?Set FOLIO_POSTGRES_PASSWORD in the private local environment}
    ports:
      - "127.0.0.1:5541:5432"
    volumes:
      - folio-pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-folio.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 10
volumes:
  folio-pgdata:
    name: folio-pgdata
